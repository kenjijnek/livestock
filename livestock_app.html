<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>畜産在庫管理</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
:root {
  --primary: #1565c0;
  --primary-d: #0d47a1;
  --primary-l: #e3f2fd;
  --danger: #c62828;
  --danger-l: #ffebee;
  --success: #2e7d32;
  --success-l: #e8f5e9;
  --warning: #e65100;
  --warning-l: #fff3e0;
  --gray: #757575;
  --gray-l: #f5f5f5;
  --border: #e0e0e0;
  --text: #212121;
  --text-s: #616161;
  --white: #fff;
  --nav-h: 60px;
}
body {
  font-family: -apple-system, 'Helvetica Neue', Arial, sans-serif;
  background: var(--gray-l);
  color: var(--text);
  font-size: 15px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}

/* ── Header ── */
.hdr {
  position: sticky; top: 0; z-index: 100;
  background: var(--primary);
  color: var(--white);
  padding: 0 14px;
  display: flex; align-items: center; gap: 10px;
  min-height: 52px;
  box-shadow: 0 2px 6px rgba(0,0,0,.25);
}
.hdr-back {
  background: none; border: none; color: var(--white);
  font-size: 28px; cursor: pointer; padding: 4px 2px; line-height: 1;
  display: none;
}
.hdr-title { font-size: 17px; font-weight: 700; flex: 1; }
.hdr-export {
  background: rgba(255,255,255,.18); border: none; color: var(--white);
  font-size: 12px; padding: 5px 10px; border-radius: 6px; cursor: pointer;
}

/* ── Bottom Nav ── */
.bnav {
  position: fixed; bottom: 0; left: 0; right: 0; z-index: 100;
  background: var(--white);
  border-top: 1px solid var(--border);
  display: flex;
  padding-bottom: env(safe-area-inset-bottom, 0);
}
.bnav-btn {
  flex: 1; display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  padding: 8px 4px;
  min-height: var(--nav-h);
  background: none; border: none; cursor: pointer;
  color: var(--gray); font-size: 10px; gap: 3px;
  position: relative;
}
.bnav-btn.on { color: var(--primary); }
.bnav-icon { font-size: 22px; line-height: 1; }
.bnav-badge {
  position: absolute; top: 5px; right: calc(50% - 20px);
  background: var(--danger); color: var(--white);
  font-size: 10px; font-weight: 700;
  border-radius: 10px; padding: 1px 5px;
  min-width: 18px; text-align: center;
  display: none;
}

/* ── Main ── */
.main {
  padding-bottom: calc(var(--nav-h) + env(safe-area-inset-bottom, 0) + 8px);
}
.page { display: none; }
.page.on { display: block; }

/* ── Filter tabs ── */
.ftabs {
  display: flex; background: var(--white);
  border-bottom: 1px solid var(--border);
  overflow-x: auto; -webkit-overflow-scrolling: touch;
  scrollbar-width: none; position: sticky; top: 52px; z-index: 50;
}
.ftabs::-webkit-scrollbar { display: none; }
.ftab {
  padding: 10px 16px; white-space: nowrap;
  border: none; background: none; cursor: pointer;
  font-size: 14px; color: var(--text-s);
  border-bottom: 2px solid transparent;
  flex-shrink: 0;
}
.ftab.on { color: var(--primary); border-bottom-color: var(--primary); font-weight: 600; }

/* ── Cards ── */
.cards { padding: 8px; }
.card {
  background: var(--white); border-radius: 10px;
  margin-bottom: 8px; overflow: hidden;
  box-shadow: 0 1px 4px rgba(0,0,0,.09);
}
.card-row {
  padding: 12px 14px; cursor: pointer;
  display: flex; align-items: center; gap: 10px;
}
.card-row:active { background: var(--gray-l); }
.card-main { flex: 1; min-width: 0; }
.card-title { font-size: 16px; font-weight: 600; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.card-sub { font-size: 13px; color: var(--text-s); margin-top: 2px; }
.chevron { color: var(--border); font-size: 20px; flex-shrink: 0; }

/* ── Badges ── */
.bdg {
  display: inline-flex; align-items: center;
  font-size: 11px; font-weight: 700;
  padding: 2px 7px; border-radius: 10px;
}
.bdg-r { background: var(--danger-l); color: var(--danger); }
.bdg-g { background: var(--success-l); color: var(--success); }
.bdg-b { background: var(--primary-l); color: var(--primary); }
.bdg-o { background: var(--warning-l); color: var(--warning); }
.bdg-gray { background: var(--gray-l); color: var(--gray); }

/* ── Detail ── */
.det-hdr {
  background: var(--white); padding: 14px 16px;
  border-bottom: 1px solid var(--border);
}
.det-name { font-size: 20px; font-weight: 700; }
.det-meta { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.det-tabs {
  display: flex; background: var(--white);
  border-bottom: 2px solid var(--border);
  position: sticky; top: 52px; z-index: 50;
}
.det-tab {
  flex: 1; padding: 12px 8px; text-align: center;
  border: none; background: none; cursor: pointer;
  font-size: 14px; font-weight: 500; color: var(--text-s);
  border-bottom: 2px solid transparent; margin-bottom: -2px;
}
.det-tab.on { color: var(--primary); border-bottom-color: var(--primary); }

/* ── Inventory items ── */
.inv-wrap { margin: 8px; border-radius: 10px; overflow: hidden; background: var(--white); box-shadow: 0 1px 4px rgba(0,0,0,.09); }
.inv-item {
  padding: 11px 14px; border-bottom: 1px solid var(--border);
}
.inv-item:last-child { border-bottom: none; }
.inv-item.alert { border-left: 3px solid var(--danger); }
.inv-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
.inv-name { font-size: 15px; font-weight: 500; flex: 1; }
.inv-ctrl { display: flex; align-items: center; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
.stkbtn {
  width: 34px; height: 34px; border-radius: 50%;
  border: 1.5px solid var(--primary); background: var(--white);
  color: var(--primary); font-size: 22px; line-height: 1;
  cursor: pointer; display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
}
.stkbtn:active { background: var(--primary-l); }
.stkinput {
  width: 62px; text-align: center;
  border: 1.5px solid var(--border); border-radius: 7px;
  padding: 4px 4px; font-size: 18px; font-weight: 700;
  -moz-appearance: textfield;
}
.stkinput::-webkit-outer-spin-button,
.stkinput::-webkit-inner-spin-button { -webkit-appearance: none; }
.stkinput:focus { outline: none; border-color: var(--primary); }
.stkinput.dirty { border-color: var(--warning); background: var(--warning-l); }
.stk-unit { font-size: 13px; color: var(--text-s); }
.stk-target { font-size: 12px; color: var(--text-s); margin-left: auto; white-space: nowrap; }
.inv-date { font-size: 11px; color: var(--text-s); margin-top: 5px; }

/* ── Visit items ── */
.vis-wrap { margin: 8px; border-radius: 10px; overflow: hidden; background: var(--white); box-shadow: 0 1px 4px rgba(0,0,0,.09); }
.vis-item { padding: 12px 14px; border-bottom: 1px solid var(--border); }
.vis-item:last-child { border-bottom: none; }
.vis-meta { font-size: 12px; color: var(--text-s); margin-bottom: 2px; }
.vis-content { font-size: 15px; font-weight: 500; }
.vis-farmer { color: var(--primary); }
.vis-memo { font-size: 13px; color: var(--text-s); margin-top: 3px; }
.vis-next { font-size: 12px; color: var(--primary); margin-top: 3px; }

/* ── FAB ── */
.fab {
  position: fixed;
  right: 16px;
  bottom: calc(var(--nav-h) + env(safe-area-inset-bottom, 0) + 14px);
  width: 52px; height: 52px; border-radius: 50%;
  background: var(--primary); color: var(--white);
  font-size: 30px; border: none; cursor: pointer;
  box-shadow: 0 3px 10px rgba(0,0,0,.3);
  display: none; align-items: center; justify-content: center;
  z-index: 90;
}
.fab.on { display: flex; }
.fab:active { opacity: .85; }

/* ── Modal ── */
.overlay {
  position: fixed; inset: 0;
  background: rgba(0,0,0,.5);
  z-index: 200; display: none;
  align-items: flex-end; justify-content: center;
}
.overlay.on { display: flex; }
.modal {
  background: var(--white);
  border-radius: 16px 16px 0 0;
  width: 100%; max-height: 92vh;
  overflow-y: auto; -webkit-overflow-scrolling: touch;
  padding-bottom: env(safe-area-inset-bottom, 0);
}
.modal-hdr {
  padding: 16px; border-bottom: 1px solid var(--border);
  display: flex; align-items: center; justify-content: space-between;
  position: sticky; top: 0; background: var(--white); z-index: 1;
}
.modal-title { font-size: 17px; font-weight: 700; }
.modal-x {
  background: var(--gray-l); border: none;
  width: 28px; height: 28px; border-radius: 50%;
  cursor: pointer; font-size: 16px;
  display: flex; align-items: center; justify-content: center;
}
.modal-body { padding: 16px; }
.fg { margin-bottom: 16px; }
.flabel { display: block; font-size: 13px; font-weight: 600; color: var(--text-s); margin-bottom: 6px; }
.fctl {
  width: 100%; padding: 10px 12px;
  border: 1.5px solid var(--border); border-radius: 8px;
  font-size: 15px; background: var(--white);
  -webkit-appearance: none; appearance: none;
}
.fctl:focus { outline: none; border-color: var(--primary); }
textarea.fctl { height: 80px; resize: none; }
.modal-ok {
  width: 100%; padding: 14px;
  background: var(--primary); color: var(--white);
  border: none; border-radius: 10px;
  font-size: 16px; font-weight: 700; cursor: pointer; margin-top: 4px;
}
.modal-ok:active { opacity: .85; }

/* ── Alert section headers ── */
.sec-hdr {
  padding: 8px 12px 4px;
  font-size: 12px; font-weight: 700; color: var(--text-s);
  letter-spacing: .4px; background: var(--gray-l);
}

/* ── Empty state ── */
.empty { padding: 64px 20px; text-align: center; color: var(--text-s); }
.empty-icon { font-size: 48px; margin-bottom: 12px; }
.empty-txt { font-size: 15px; }

/* ── Toast ── */
.toast {
  position: fixed;
  bottom: calc(var(--nav-h) + env(safe-area-inset-bottom, 0) + 14px);
  left: 50%; transform: translateX(-50%);
  background: #323232; color: var(--white);
  padding: 9px 20px; border-radius: 20px;
  font-size: 14px; z-index: 300;
  opacity: 0; transition: opacity .25s;
  pointer-events: none; white-space: nowrap;
}
.toast.on { opacity: 1; }

/* ── Add-visit btn in detail ── */
.add-vis-btn {
  display: block; width: calc(100% - 16px);
  margin: 8px; padding: 12px;
  background: var(--primary); color: var(--white);
  border: none; border-radius: 10px;
  font-size: 15px; font-weight: 600; cursor: pointer;
  text-align: center;
}
.add-vis-btn:active { opacity: .85; }

/* ── Memo edit ── */
.memo-area {
  width: 100%; padding: 8px 10px;
  border: 1.5px solid var(--border); border-radius: 7px;
  font-size: 14px; resize: none; height: 64px;
  font-family: inherit;
}
.memo-area:focus { outline: none; border-color: var(--primary); }
.memo-save {
  margin-top: 6px; padding: 7px 16px;
  background: var(--primary); color: var(--white);
  border: none; border-radius: 7px; font-size: 13px; font-weight: 600; cursor: pointer;
}
/* ── Edit/Delete buttons ── */
.edit-btn {
  padding: 4px 12px; font-size: 12px; font-weight: 600;
  background: var(--gray-l); color: var(--text-s);
  border: 1px solid var(--border); border-radius: 6px; cursor: pointer;
}
.add-item-btn {
  display: block; width: calc(100% - 16px);
  margin: 8px; padding: 11px;
  background: var(--white); color: var(--primary);
  border: 1.5px dashed var(--primary); border-radius: 10px;
  font-size: 14px; font-weight: 600; cursor: pointer; text-align: center;
}
.del-modal-btn {
  width: 100%; margin-top: 8px; padding: 12px;
  background: var(--danger-l); color: var(--danger);
  border: 1px solid var(--danger); border-radius: 10px;
  font-size: 15px; font-weight: 600; cursor: pointer;
}
.add-farmer-btn {
  display: block; margin: 4px 8px 12px;
  padding: 12px; text-align: center;
  background: var(--white); color: var(--primary);
  border: 1.5px dashed var(--primary); border-radius: 10px;
  font-size: 14px; font-weight: 600; cursor: pointer;
}
</style>
</head>
<body>

<div id="hdr" class="hdr">
  <button class="hdr-back" id="back-btn" onclick="goBack()">‹</button>
  <span class="hdr-title" id="hdr-title">畜産在庫管理</span>
  <button class="hdr-export" onclick="exportData()">書出し</button>
</div>

<div class="main">
  <!-- 農家一覧 -->
  <div class="page on" id="pg-farmers">
    <div class="ftabs" id="farmer-ftabs"></div>
    <div class="cards" id="farmer-list"></div>
  </div>

  <!-- 農家詳細 -->
  <div class="page" id="pg-detail">
    <div id="det-hdr-area"></div>
    <div class="det-tabs" id="det-tabs"></div>
    <div id="det-body"></div>
  </div>

  <!-- 要補充 -->
  <div class="page" id="pg-alerts">
    <div id="alert-body"></div>
  </div>

  <!-- 訪問記録 -->
  <div class="page" id="pg-visits">
    <div class="ftabs" id="visit-ftabs"></div>
    <div id="visit-list"></div>
  </div>
</div>

<!-- Bottom nav -->
<nav class="bnav">
  <button class="bnav-btn on" id="nav-farmers" onclick="goPage('farmers')">
    <span class="bnav-icon">🏠</span><span>農家</span>
  </button>
  <button class="bnav-btn" id="nav-alerts" onclick="goPage('alerts')">
    <span class="bnav-icon">⚠️</span><span>要補充</span>
    <span class="bnav-badge" id="alert-badge"></span>
  </button>
  <button class="bnav-btn" id="nav-visits" onclick="goPage('visits')">
    <span class="bnav-icon">📋</span><span>訪問記録</span>
  </button>
</nav>

<!-- FAB -->
<button class="fab" id="fab" onclick="openVisitModal()">＋</button>

<!-- Visit Modal -->
<div class="overlay" id="overlay" onclick="overlayClick(event)">
  <div class="modal" id="modal">
    <div class="modal-hdr">
      <span class="modal-title" id="modal-title">訪問記録を追加</span>
      <button class="modal-x" onclick="closeModal()">✕</button>
    </div>
    <div class="modal-body">
      <div class="fg">
        <label class="flabel">農家名</label>
        <select class="fctl" id="v-farmer"></select>
      </div>
      <div class="fg">
        <label class="flabel">訪問日</label>
        <input type="date" class="fctl" id="v-date">
      </div>
      <div class="fg">
        <label class="flabel">在庫確認</label>
        <select class="fctl" id="v-check">
          <option>完了</option><option>未完了</option>
        </select>
      </div>
      <div class="fg">
        <label class="flabel">商談内容</label>
        <select class="fctl" id="v-content">
          <option>定期訪問</option>
          <option>補充提案あり</option>
          <option>新商品提案</option>
          <option>クレーム対応</option>
          <option>在庫確認のみ</option>
        </select>
      </div>
      <div class="fg">
        <label class="flabel">課題・メモ</label>
        <textarea class="fctl" id="v-memo" placeholder="自由記入…"></textarea>
      </div>
      <div class="fg">
        <label class="flabel">次回訪問予定</label>
        <input type="date" class="fctl" id="v-next">
      </div>
      <div class="fg">
        <label class="flabel">担当者</label>
        <input type="text" class="fctl" id="v-person" placeholder="担当者名">
      </div>
      <button class="modal-ok" onclick="saveVisit()">保存する</button>
    </div>
  </div>
</div>

<!-- Farmer / Inventory Edit Modal -->
<div class="overlay" id="edit-overlay" onclick="editOverlayClick(event)">
  <div class="modal">
    <div class="modal-hdr">
      <span class="modal-title" id="edit-modal-title">編集</span>
      <button class="modal-x" onclick="closeEditModal()">✕</button>
    </div>
    <div class="modal-body" id="edit-modal-body"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

// ═══════════════════════════════════════
//  STATE & STORAGE
// ═══════════════════════════════════════
let db = loadDB();

function loadDB() {
  try {
    const s = localStorage.getItem('livestock_v1');
    if (s) return JSON.parse(s);
  } catch(e) {}
  return JSON.parse(JSON.stringify(INIT));
}
function saveDB() {
  localStorage.setItem('livestock_v1', JSON.stringify(db));
}

let curPage = 'farmers';
let curFarmer = null;
let detTab = 'inv';
let fFilter = '全て';
let vFilter = '全て';

// ═══════════════════════════════════════
//  HELPERS
// ═══════════════════════════════════════
function districts() {
  return ['全て', ...new Set(db.farmers.map(f => f.district))];
}
function todayISO() {
  const d = new Date();
  return `${d.getFullYear()}/${String(d.getMonth()+1).padStart(2,'0')}/${String(d.getDate()).padStart(2,'0')}`;
}
function todayInput() {
  return todayISO().replace(/\//g, '-');
}
function disp2input(s) { return s ? s.replace(/\//g,'-') : ''; }
function input2disp(s) { return s ? s.replace(/-/g,'/') : ''; }

function isAlert(item) { return item.stock <= item.target; }
function farmerAlertCnt(name) { return db.inventory.filter(i => i.farmer === name && isAlert(i)).length; }
function totalAlerts() { return db.inventory.filter(i => isAlert(i)).length; }

function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('on');
  clearTimeout(el._t);
  el._t = setTimeout(() => el.classList.remove('on'), 2000);
}
function updateBadge() {
  const cnt = totalAlerts();
  const b = document.getElementById('alert-badge');
  b.textContent = cnt;
  b.style.display = cnt ? '' : 'none';
}

// ═══════════════════════════════════════
//  NAVIGATION
// ═══════════════════════════════════════
function goPage(page, farmerName) {
  // Pages
  document.querySelectorAll('.page').forEach(p => p.classList.remove('on'));
  // Nav buttons
  ['farmers','alerts','visits'].forEach(id => {
    document.getElementById('nav-'+id).classList.remove('on');
  });
  const fab = document.getElementById('fab');
  const backBtn = document.getElementById('back-btn');
  const title = document.getElementById('hdr-title');

  if (page === 'detail') {
    curFarmer = farmerName;
    curPage = 'detail';
    document.getElementById('pg-detail').classList.add('on');
    document.getElementById('nav-farmers').classList.add('on');
    backBtn.style.display = 'block';
    title.textContent = farmerName;
    fab.classList.remove('on');
    renderDetail();
  } else {
    curPage = page;
    document.getElementById('pg-'+page).classList.add('on');
    document.getElementById('nav-'+page).classList.add('on');
    backBtn.style.display = 'none';
    fab.classList.remove('on');

    if (page === 'farmers') {
      title.textContent = '畜産在庫管理';
      renderFarmers();
    } else if (page === 'alerts') {
      title.textContent = '要補充リスト';
      renderAlerts();
    } else if (page === 'visits') {
      title.textContent = '訪問記録';
      fab.classList.add('on');
      renderVisits();
    }
  }
  window.scrollTo(0, 0);
}

function goBack() {
  if (curPage === 'detail') goPage('farmers');
}

function renderFarmers() {
  const ds = districts();
  document.getElementById('farmer-ftabs').innerHTML = ds.map(d =>
    `<button class="ftab${d===fFilter?' on':''}" onclick="setFF('${d}')">${d}</button>`
  ).join('');

  const list = fFilter === '全て' ? db.farmers : db.farmers.filter(f => f.district === fFilter);
  if (!list.length) {
    document.getElementById('farmer-list').innerHTML = '<div class="empty"><div class="empty-icon">🏠</div><div class="empty-txt">農家が見つかりません</div></div>';
    return;
  }

  document.getElementById('farmer-list').innerHTML = list.map(f => {
    const ac = farmerAlertCnt(f.name);
    const lv = db.visits.filter(v => v.farmer === f.name).sort((a,b) => b.date.localeCompare(a.date))[0];
    return `<div class="card">
      <div class="card-row" onclick="goPage('detail','${esc(f.name)}')">
        <div class="card-main">
          <div class="card-title">
            ${esc(f.name)}

            ${ac>0?`<span class="bdg bdg-r">要補充 ${ac}</span>`:''}

        </div>
        <span class="chevron">›</span>
      </div>
    </div>`;
  }).join('') + `<button class="add-farmer-btn" onclick="openFarmerEditModal('')">＋ 農家を追加</button>`;
}
function setFF(d) { fFilter = d; renderFarmers(); }

function setDetTab(t) { detTab = t; renderDetail(); }

function renderInvTab() {
  const items = db.inventory.filter(i => i.farmer === curFarmer)
    .sort((a,b) => (isAlert(b)?1:0)-(isAlert(a)?1:0) || a.product.localeCompare(b.product));
  if (!items.length) return '<div class="empty"><div class="empty-txt">在庫データなし</div></div>';

  return '<div class="inv-wrap">' + items.map((item, idx) => {
    const al = isAlert(item);
    const key = esc(item.farmer)+'|'+esc(item.product);
    return `<div class="inv-item${al?' alert':''}">
      <div class="inv-top">
        <span class="inv-name">${esc(item.product)}</span>
        <div style="display:flex;align-items:center;gap:6px">
          <span class="bdg ${al?'bdg-r':'bdg-g'}">${al?'要補充':'適正'}</span>
          <button class="edit-btn" onclick="openInvEditModal('${esc(item.farmer)}','${esc(item.product)}')">編集</button>
        </div>
      </div>
      <div class="inv-ctrl">
        <button class="stkbtn" onclick="adj('${key}',-1)">−</button>
        <input class="stkinput" type="number" min="0" value="${item.stock}"
          id="si-${idx}"
          onblur="commitStock('${key}',this)"
          oninput="this.classList.add('dirty')">
        <button class="stkbtn" onclick="adj('${key}',1)">＋</button>
        <span class="stk-unit">${item.unit}</span>
        <span class="stk-target">目安: ${item.target}${item.unit}</span>
      </div>
      <div class="inv-date">最終確認: ${item.lastCheck} ／ 次回: ${item.nextCheck}</div>
    </div>`;
  }).join('') + '</div>' +
  `<button class="add-item-btn" onclick="openInvEditModal('${esc(curFarmer)}','')">＋ 商品を追加</button>`;
}

function renderVisTab() {
  const visits = db.visits.filter(v => v.farmer === curFarmer)
    .sort((a,b) => b.date.localeCompare(a.date));
  const inner = !visits.length
    ? '<div class="empty"><div class="empty-icon">📋</div><div class="empty-txt">訪問記録なし</div></div>'
    : '<div class="vis-wrap">' + visits.map(v => `
      <div class="vis-item">
        <div class="vis-meta">${v.date} · ${v.check} · ${v.person}</div>
        <div class="vis-content">${esc(v.content)}</div>
        ${v.memo?`<div class="vis-memo">${esc(v.memo)}</div>`:''}
        ${v.next?`<div class="vis-next">次回予定: ${v.next}</div>`:''}
      </div>`).join('') + '</div>';

  return inner + `<button class="add-vis-btn" onclick="openVisitModal('${esc(curFarmer)}')">＋ 訪問記録を追加</button>`;
}

function saveMemo() {
  const f = db.farmers.find(x => x.name === curFarmer);
  if (!f) return;
  f.memo = document.getElementById('farmer-memo').value;
  saveDB();
  toast('メモを保存しました');
}

// ═══════════════════════════════════════
//  STOCK CONTROL
// ═══════════════════════════════════════
function findItem(key) {
  const [farmer, product] = key.split('|');
  return db.inventory.find(i => i.farmer === farmer && i.product === product);
}
function updateItemStatus(item) {
  item.lastCheck = todayISO();
  // status recalc happens in isAlert() dynamically — no stored field needed
  saveDB();
  updateBadge();
}

function adj(key, delta) {
  const item = findItem(key);
  if (!item) return;
  item.stock = Math.max(0, item.stock + delta);
  updateItemStatus(item);
  renderDetail();
  toast('在庫を更新しました');
}
function commitStock(key, input) {
  const item = findItem(key);
  if (!item) return;
  const v = parseInt(input.value);
  item.stock = isNaN(v) || v < 0 ? 0 : v;
  input.value = item.stock;
  input.classList.remove('dirty');
  updateItemStatus(item);
  updateBadge();
  // Refresh badge in header without full re-render
  const f = db.farmers.find(x => x.name === curFarmer);
  const ac = farmerAlertCnt(curFarmer);
  // re-render header badges
  renderDetail();
  toast('在庫を更新しました');
}

// ═══════════════════════════════════════
//  RENDER: ALERTS
// ═══════════════════════════════════════
function renderAlerts() {
  const alerts = db.inventory.filter(i => isAlert(i));
  const body = document.getElementById('alert-body');
  if (!alerts.length) {
    body.innerHTML = '<div class="empty"><div class="empty-icon">✅</div><div class="empty-txt">要補充の商品はありません</div></div>';
    return;
  }

  // Group by district → farmer
  const byDist = {};
  alerts.forEach(i => {
    if (!byDist[i.district]) byDist[i.district] = {};
    if (!byDist[i.district][i.farmer]) byDist[i.district][i.farmer] = [];
    byDist[i.district][i.farmer].push(i);
  });

  let html = `<div style="padding:6px 12px 2px;font-size:13px;color:var(--text-s)">計 ${alerts.length} 件</div>`;
  for (const [dist, farmers] of Object.entries(byDist)) {
    html += `<div class="sec-hdr">${dist}</div>`;
    for (const [fn, items] of Object.entries(farmers)) {
      const detail = items.map(i => `${i.product}（${i.stock}/${i.target}${i.unit}）`).join(' · ');
      html += `<div class="card" style="margin:4px 8px;border-radius:10px;overflow:hidden">
        <div class="card-row" onclick="goPage('detail','${esc(fn)}')">
          <div class="card-main">
            <div style="font-size:15px;font-weight:700">${esc(fn)}</div>
            <div style="font-size:13px;color:var(--text-s);margin-top:2px">${detail}</div>
          </div>
          <span class="chevron">›</span>
        </div>
      </div>`;
    }
  }
  body.innerHTML = html;
}

  ).join('');

  const filtered = (vFilter === '全て' ? [...db.visits] : db.visits.filter(v => v.district === vFilter))
    .sort((a,b) => b.date.localeCompare(a.date));

  if (!filtered.length) {
    document.getElementById('visit-list').innerHTML = '<div class="empty"><div class="empty-icon">📋</div><div class="empty-txt">訪問記録なし</div></div>';
    return;
  }
  document.getElementById('visit-list').innerHTML = '<div class="vis-wrap" style="margin:8px;border-radius:10px;overflow:hidden;background:var(--white);box-shadow:0 1px 4px rgba(0,0,0,.09)">' +
    filtered.map(v => `
      <div class="vis-item">
        <div class="vis-meta">${v.date} · ${v.district} · ${v.check} · ${v.person}</div>
        <div class="vis-content"><span class="vis-farmer" onclick="goPage('detail','${esc(v.farmer)}')">${esc(v.farmer)}</span> — ${esc(v.content)}</div>
        ${v.memo?`<div class="vis-memo">${esc(v.memo)}</div>`:''}
        ${v.next?`<div class="vis-next">次回予定: ${v.next}</div>`:''}
      </div>`).join('') + '</div>';
}
function setVF(d) { vFilter = d; renderVisits(); }

// ═══════════════════════════════════════
//  VISIT MODAL
// ═══════════════════════════════════════
function openVisitModal(preselect) {
  const sel = document.getElementById('v-farmer');
  sel.innerHTML = '<option value="">選択…</option>' +
    db.farmers.map(f => `<option value="${esc(f.name)}"${f.name===(preselect||'')?' selected':''}>${esc(f.name)}（${f.district}）</option>`).join('');
  document.getElementById('v-date').value = todayInput();
  document.getElementById('v-next').value = '';
  document.getElementById('v-memo').value = '';
  document.getElementById('v-person').value = '';
  document.getElementById('overlay').classList.add('on');
}
function closeModal() { document.getElementById('overlay').classList.remove('on'); }
function overlayClick(e) { if (e.target === document.getElementById('overlay')) closeModal(); }

function saveVisit() {
  const fn = document.getElementById('v-farmer').value;
  if (!fn) { alert('農家を選択してください'); return; }
  const d = document.getElementById('v-date').value;
  if (!d) { alert('訪問日を入力してください'); return; }
  const f = db.farmers.find(x => x.name === fn);
  db.visits.unshift({
    id: db.nextId++,
    date: input2disp(d),
    farmer: fn,
    district: f ? f.district : '',
    check: document.getElementById('v-check').value,
    content: document.getElementById('v-content').value,
    memo: document.getElementById('v-memo').value.trim(),
    next: input2disp(document.getElementById('v-next').value),
    person: document.getElementById('v-person').value.trim(),
  });
  saveDB();
  closeModal();
  toast('訪問記録を保存しました');
  if (curPage === 'visits') renderVisits();
  if (curPage === 'detail' && curFarmer === fn) renderDetail();
}

// ═══════════════════════════════════════
//  FARMER EDIT
// ═══════════════════════════════════════
function openFarmerEditModal(farmerName) {
  const f = db.farmers.find(x => x.name === farmerName) || {name:'',district:'',type:'酪農',cattle:0,rel:'普通'};
  const isNew = !farmerName;
  document.getElementById('edit-modal-title').textContent = isNew ? '農家を追加' : '農家情報を編集';
  document.getElementById('edit-modal-body').innerHTML = `
    <div class="fg"><label class="flabel">農家名</label>
      <input type="text" class="fctl" id="ef-name" value="${esc(f.name)}" placeholder="農家名"></div>
    <div class="fg"><label class="flabel">地区</label>
      <input type="text" class="fctl" id="ef-district" value="${esc(f.district)}" placeholder="地区名"></div>
    <div class="fg"><label class="flabel">頭数</label>
      <input type="number" class="fctl" id="ef-cattle" value="${f.cattle}" min="0"></div>
    <div class="fg"><label class="flabel">関係フラグ</label>
      <select class="fctl" id="ef-rel">
        <option${f.rel==='重要'?' selected':''}>重要</option>
        <option${f.rel==='普通'?' selected':''}>普通</option>
      </select></div>
    <button class="modal-ok" onclick="saveFarmerEdit('${esc(farmerName)}')">保存する</button>
    ${farmerName?`<button class="del-modal-btn" onclick="deleteFarmer('${esc(farmerName)}')">削除する</button>`:''}`;
  document.getElementById('edit-overlay').classList.add('on');
}

function saveFarmerEdit(oldName) {
  const name = document.getElementById('ef-name').value.trim();
  const district = document.getElementById('ef-district').value.trim();
  const cattle = parseInt(document.getElementById('ef-cattle').value) || 0;
  const rel = document.getElementById('ef-rel').value;
  if (!name) { alert('農家名を入力してください'); return; }
  if (!district) { alert('地区を入力してください'); return; }

  if (oldName) {
    const f = db.farmers.find(x => x.name === oldName);
    if (!f) return;
    if (name !== oldName) {
      db.inventory.forEach(i => { if (i.farmer === oldName) i.farmer = name; });
      db.visits.forEach(v => { if (v.farmer === oldName) v.farmer = name; });
    }
    db.inventory.forEach(i => { if (i.farmer === name) i.district = district; });
    db.visits.forEach(v => { if (v.farmer === name) v.district = district; });
    f.name = name; f.district = district; f.cattle = cattle; f.rel = rel;
    curFarmer = name;
    document.getElementById('hdr-title').textContent = name;
  } else {
    db.farmers.push({name, district, type:'酪農', cattle, rel, memo:''});
  }
  saveDB();
  closeEditModal();
  toast(oldName ? '農家情報を更新しました' : '農家を追加しました');
  if (oldName) renderDetail(); else { goPage('farmers'); }
}

function deleteFarmer(name) {
  if (!confirm('「' + name + '」を削除しますか？\n在庫・訪問記録も削除されます。')) return;
  db.farmers = db.farmers.filter(f => f.name !== name);
  db.inventory = db.inventory.filter(i => i.farmer !== name);
  db.visits = db.visits.filter(v => v.farmer !== name);
  saveDB();
  closeEditModal();
  goPage('farmers');
  toast('削除しました');
}

// ═══════════════════════════════════════
//  INVENTORY EDIT
// ═══════════════════════════════════════
function openInvEditModal(farmerName, product) {
  const item = product ? db.inventory.find(i => i.farmer === farmerName && i.product === product) : null;
  document.getElementById('edit-modal-title').textContent = item ? '商品を編集' : '商品を追加';
  document.getElementById('edit-modal-body').innerHTML = `
    <div class="fg"><label class="flabel">商品名</label>
      <input type="text" class="fctl" id="ei-product" value="${esc(item?item.product:'')}" placeholder="商品名"></div>
    <div class="fg"><label class="flabel">単位</label>
      <input type="text" class="fctl" id="ei-unit" value="${esc(item?item.unit:'')}" placeholder="kg / 袋 / 本"></div>
    <div class="fg"><label class="flabel">現在庫数</label>
      <input type="number" class="fctl" id="ei-stock" value="${item?item.stock:0}" min="0"></div>
    <div class="fg"><label class="flabel">補充目安数</label>
      <input type="number" class="fctl" id="ei-target" value="${item?item.target:0}" min="0"></div>
    <button class="modal-ok" onclick="saveInvEdit('${esc(farmerName)}','${esc(product)}')">保存する</button>
    ${item?`<button class="del-modal-btn" onclick="deleteInvItem('${esc(farmerName)}','${esc(product)}')">削除する</button>`:''}`;
  document.getElementById('edit-overlay').classList.add('on');
}

function saveInvEdit(farmerName, oldProduct) {
  const product = document.getElementById('ei-product').value.trim();
  const unit = document.getElementById('ei-unit').value.trim();
  const stock = parseInt(document.getElementById('ei-stock').value) || 0;
  const target = parseInt(document.getElementById('ei-target').value) || 0;
  if (!product) { alert('商品名を入力してください'); return; }
  if (!unit) { alert('単位を入力してください'); return; }
  const f = db.farmers.find(x => x.name === farmerName);
  if (oldProduct) {
    const item = db.inventory.find(i => i.farmer === farmerName && i.product === oldProduct);
    if (item) { item.product = product; item.unit = unit; item.stock = stock; item.target = target; item.lastCheck = todayISO(); }
  } else {
    db.inventory.push({farmer:farmerName, district:f?f.district:'', product, unit, stock, target, lastCheck:todayISO(), nextCheck:''});
  }
  saveDB(); updateBadge(); closeEditModal();
  toast(oldProduct ? '商品を更新しました' : '商品を追加しました');
  renderDetail();
}

function deleteInvItem(farmerName, product) {
  if (!confirm('「' + product + '」を削除しますか？')) return;
  db.inventory = db.inventory.filter(i => !(i.farmer === farmerName && i.product === product));
  saveDB(); updateBadge(); closeEditModal(); renderDetail();
  toast('削除しました');
}

function closeEditModal() { document.getElementById('edit-overlay').classList.remove('on'); }
function editOverlayClick(e) { if (e.target === document.getElementById('edit-overlay')) closeEditModal(); }

// ═══════════════════════════════════════
//  EXPORT
// ═══════════════════════════════════════
function exportData() {
  const blob = new Blob([JSON.stringify(db, null, 2)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'livestock_backup_' + todayISO().replace(/\//g,'-') + '.json';
  a.click();
}

// ═══════════════════════════════════════
//  UTILS
// ═══════════════════════════════════════
function esc(s) {
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

// ═══════════════════════════════════════
//  UTILS
// ═══════════════════════════════════════
function esc2(s) { return String(s||''); }

// ═══════════════════════════════════════
//  INIT
// ═══════════════════════════════════════
function init() {
  try {
    updateBadge();
    renderFarmers();
  } catch(e) {
    document.getElementById('farmer-list').innerHTML =
      '<div style="padding:20px;color:red">エラー: ' + e.message + '</div>';
  }
}

if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', init);
} else {
  init();
}
</script>
</body>
</html>
